[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-collab"
version = "0.2.1"
description = "Transactional local evidence exchange for cooperating coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Lucienne Swart", email = "ljswart@me.com"}]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux"]

[project.scripts]
agent-collab = "agent_collab.cli:main"

[tool.setuptools.packages.find]
include = ["agent_collab*"]
